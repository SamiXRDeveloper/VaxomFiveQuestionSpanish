# Unity WebGL — place in build output root (same folder as index.html).
# Prefer Disabled compression on Netlify, or enable matching [[headers]] below.

[[headers]]
  for = "/Build/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/Build/*.data"
  [headers.values]
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/Build/*.js"
  [headers.values]
    Content-Type = "application/javascript"

